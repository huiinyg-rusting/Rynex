[package]
name = "rynex-kernel"
version = "0.0.1"
edition = "2021"

[dependencies]
x86_64 = { version = "0.15", features = ["nightly"] }

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1

# Lints that are deliberate in this bare-metal kernel are allowed here so real
# clippy regressions stay visible instead of being drowned by intentional noise:
# - static_mut_refs: pervasive globals guarded by manual IRQ-save locking.
# - non_upper_case_globals: syscall constants follow Linux names (SYS_read, ...).
# - fn_to_numeric_cast: function pointers are taken as physical addresses.
# - needless_range_loop: index-style loops match the surrounding code style.
# - dead_code: deliberate WIP/API surface not yet wired up (ext3, xattr, ipc
#   ports, vfs fd tables, procfs, tty/termios, multiboot2 tags, ...).
# - unused_assignments / unused_variables: defensive writes and asm outputs
#   (cmpxchg scratch, visited_* tracking) that the compiler can't see used.
[lints.rust]
static_mut_refs = "allow"
non_upper_case_globals = "allow"
dead_code = "allow"
unused_assignments = "allow"
unused_variables = "allow"

[lints.clippy]
# Deliberate kernel patterns (function-pointer addresses, index-style loops).
fn_to_numeric_cast = "allow"
needless_range_loop = "allow"
# Pervasive cosmetic/idiomatic categories -- not audited by hand in a kernel.
empty_line_after_doc_comments = "allow"
unnecessary_cast = "allow"
# Idiomatic-but-noisy style lints (mechanical, no behavior change either way).
manual_div_ceil = "allow"
collapsible_if = "allow"
manual_range_contains = "allow"
manual_is_multiple_of = "allow"
question_mark = "allow"
manual_memcpy = "allow"
if_same_then_else = "allow"
identity_op = "allow"
useless_format = "allow"
unnecessary_map_or = "allow"
needless_return = "allow"
let_and_return = "allow"
implicit_saturating_sub = "allow"
while_let_loop = "allow"
unnecessary_unwrap = "allow"
redundant_static_lifetimes = "allow"
ptr_eq = "allow"
needless_borrow = "allow"
manual_unwrap_or_default = "allow"
manual_swap = "allow"
manual_inspect = "allow"
let_unit_value = "allow"
len_zero = "allow"
explicit_auto_deref = "allow"
empty_loop = "allow"
assign_op_pattern = "allow"